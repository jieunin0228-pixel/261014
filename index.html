<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECS 룰 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* 레이아웃: 좌측 약관 원문, 우측 룰 테이블(심사 시스템 화면처럼 밀도 높은 표) */
  :root {
    --bg: #eef2f0; --panel: #ffffff; --panel-2: #e6ece9; --head: #dbe4df; --line: #cfd8d3;
    --text: #1d2823; --muted: #5f6d66; --brand: #2c5a44; --brand-2: #3d7659; --on-brand: #ffffff;
    --accent: #c9711f; --sel: #cfe0f7;
    --ok: #e2f3e6; --ok-b: #2b8051; --cut: #fdf2c6; --cut-b: #9a6f08;
    --ex: #fbe1df; --ex-b: #b73a2e; --end-b: #2e66b8; --none-b: #7b847f;
    --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #141a17; --panel: #1b2320; --panel-2: #222c28; --head: #26322d; --line: #34413b;
    --text: #e3ebe6; --muted: #9aa8a1; --brand: #8fc9a8; --brand-2: #3f7d5e; --on-brand: #ffffff;
    --accent: #d98634; --sel: #23395a;
    --ok: #1d3326; --ok-b: #3f9e68; --cut: #3a3217; --cut-b: #b8901f;
    --ex: #3e2220; --ex-b: #d0584b; --end-b: #4a83d6; --none-b: #6f7a75; color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --bg: #141a17; --panel: #1b2320; --panel-2: #222c28; --head: #26322d; --line: #34413b;
    --text: #e3ebe6; --muted: #9aa8a1; --brand: #8fc9a8; --brand-2: #3f7d5e; --on-brand: #ffffff;
    --accent: #d98634; --sel: #23395a;
    --ok: #1d3326; --ok-b: #3f9e68; --cut: #3a3217; --cut-b: #b8901f;
    --ex: #3e2220; --ex-b: #d0584b; --end-b: #4a83d6; --none-b: #6f7a75; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 13px/1.5 var(--font-body); color: var(--text); background: var(--bg); }
  header { background: var(--brand-2); color: var(--on-brand); padding: 10px 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; text-wrap: balance; }
  header .note { font-size: 12px; opacity: .85; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 30%) minmax(0, 1fr); gap: 12px; padding-block: 12px; padding-inline: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); border-radius: 6px 6px 0 0; }
  .bar h2 { font-size: 13px; margin: 0 auto 0 0; }
  button, .filebtn { font: inherit; border: 1px solid var(--brand-2); background: var(--panel); color: var(--brand); padding: 4px 10px; border-radius: 4px; cursor: pointer; }
  button:focus-visible, .filebtn:focus-within, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--brand-2); color: var(--on-brand); }
  button.warn { border-color: var(--accent); background: var(--accent); color: var(--on-brand); }
  button:disabled { opacity: .45; cursor: default; }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .controls { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lbl { font-weight: 600; min-width: 42px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  input[type="text"], select { font: inherit; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
  input[type="text"] { flex: 1; min-width: 120px; }
  .allbox { font-weight: 700; display: flex; gap: 4px; align-items: center; cursor: pointer; }
  .catalog { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); }
  .cat { border-bottom: 1px solid var(--line); }
  .cat:last-child { border-bottom: 0; }
  .cat > summary { display: flex; gap: 6px; align-items: center; padding: 4px 8px; cursor: pointer; font-weight: 700; background: var(--head); list-style: none; }
  .cat > summary::-webkit-details-marker { display: none; }
  .cat > summary::before { content: "▸"; color: var(--muted); width: 10px; }
  .cat[open] > summary::before { content: "▾"; }
  .cat > summary small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cat.empty-cat > summary { opacity: .55; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 10px; padding: 4px 8px 6px 26px; }
  .item { display: flex; gap: 5px; align-items: baseline; padding: 2px 0; cursor: pointer; min-width: 0; }
  .item .n { min-width: 0; overflow-wrap: anywhere; }
  .item small { color: var(--muted); }
  .secinfo summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .sec { display: flex; gap: 6px; align-items: baseline; padding: 2px 8px; font-size: 12px; }
  .sec .kind { font-size: 11px; padding: 0 6px; border-radius: 8px; background: var(--head); color: var(--muted); white-space: nowrap; }
  .sec .t { flex: 1; min-width: 0; }
  .sec small { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  textarea { flex: 1; border: 0; padding: 10px; resize: none; font: 12px/1.6 var(--font-mono); background: var(--panel); color: var(--text); min-height: 160px; }
  .status { padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .chip { border: 1px solid var(--line); border-radius: 12px; padding: 1px 9px; background: var(--panel-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; border: 1px solid; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 6px 10px; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
  .views { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; overflow: auto; display: none; }
  .view.on { display: block; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: top; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--head); z-index: 1; font-weight: 600; }
  td.wrap { white-space: pre-line; min-width: 220px; max-width: 360px; }
  td.mono { font-family: var(--font-mono); }
  tr.cat-정상 td { background: var(--ok); }
  tr.cat-감액 td { background: var(--cut); }
  tr.cat-면책 td { background: var(--ex); }
  tr.rule { cursor: pointer; }
  tr.rule:hover td { filter: brightness(.97); }
  tr.rule.sel td { background: var(--sel); }
  .badge { display: inline-block; padding: 0 7px; border-radius: 10px; font-weight: 700; color: var(--on-brand); }
  .b-정상 { background: var(--ok-b); } .b-감액 { background: var(--cut-b); } .b-면책 { background: var(--ex-b); } .b-소멸 { background: var(--end-b); }
  .b-확인필요 { background: var(--none-b); }
  .detail { border-top: 2px solid var(--brand); max-height: 38%; overflow: auto; padding: 8px 12px; background: var(--panel-2); }
  .detail h3 { margin: 0 0 6px; font-size: 13px; }
  .detail blockquote { margin: 4px 0 8px; padding: 6px 10px; background: var(--panel); border-left: 3px solid var(--brand-2); white-space: pre-wrap; }
  .detail .ref { font-weight: 700; color: var(--brand); }
  .detail ul { margin: 4px 0; padding-left: 18px; }
  .empty { color: var(--muted); padding: 16px; }
  .cmp-일치 td { background: var(--ok); } .cmp-불일치 td { background: var(--ex); }
  .cmp-정답지에만 td, .cmp-생성에만 td { background: var(--cut); }
  .diff { color: var(--ex-b); font-weight: 700; }
  @media (max-width: 900px) { html, body { height: auto; } main { grid-template-columns: 1fr; } section { min-height: 60vh; } }
</style>
</head>
<body>
<header>
  <h1>ECS 룰 변환기</h1>
  <span class="note">약관 PDF → 보험금 심사 룰 테이블 · AI 분석 결과는 원문 인용과 코드표로 검증하며, 최종 반영 전 심사자 확인이 필요합니다</span>
</header>
<main>
  <section>
    <div class="bar">
      <h2>약관 입력</h2>
      <label class="filebtn">PDF·텍스트 열기<input id="fileTerms" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain"></label>
      <button id="btnSample">샘플 약관</button>
    </div>
    <div class="controls">
      <div class="row">
        <span class="lbl">코드표</span>
        <span id="masterInfo" class="muted grow"></span>
        <label class="filebtn">올리기<input id="fileMaster" type="file" accept=".xlsx,.xls"></label>
        <button id="btnTemplate">양식</button>
      </div>
      <div class="row">
        <label class="allbox"><input type="checkbox" id="catAll"> 전체 담보</label>
        <span id="pickInfo" class="muted grow"></span>
        <input id="benefitFilter" type="text" placeholder="담보 검색" aria-label="담보 검색">
      </div>
      <div class="catalog" id="catalog" aria-label="담보 선택"></div>
      <details class="secinfo">
        <summary id="secSummary">약관 구간</summary>
        <div id="sections"></div>
      </details>
      <div class="row">
        <select id="tier" aria-label="분석 방식">
          <option value="complex">정확도 우선</option>
          <option value="default">속도 우선</option>
        </select>
        <button id="btnAi" class="primary">선택 담보 AI 분석</button>
        <button id="btnStop" hidden>중지</button>
        <button id="btnRun" title="보통약관 사망 급부만 규칙으로 변환합니다(더미 약관 문형 전용)">규칙 엔진(사망)</button>
      </div>
    </div>
    <textarea id="terms" spellcheck="false" aria-label="약관 원문" placeholder="PDF·텍스트 파일을 열거나 약관을 붙여넣으세요.&#10;조문은 '제N조(제목)', 항은 ①②, 호는 '1.', 목은 '가.' 형식이어야 하며, 특약 제목 줄('○○ 특별약관')로 구간을 나눕니다."></textarea>
    <div class="status" id="status" role="status">대기 중입니다.</div>
  </section>

  <section>
    <div class="bar">
      <h2>ECS 룰 테이블</h2>
      <button id="btnSampleKey">샘플 정답지로 비교</button>
      <label class="filebtn" id="lblCompare">정답지와 비교<input id="fileAnswer" type="file" accept=".xlsx,.xls"></label>
      <button id="btnExcel" class="warn" disabled>엑셀 다운로드</button>
    </div>
    <div class="summary" id="summary"><span class="chip">변환 전입니다.</span></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--ok);border-color:var(--ok-b)"></i>정상</span>
      <span><i class="sw" style="background:var(--cut);border-color:var(--cut-b)"></i>감액</span>
      <span><i class="sw" style="background:var(--ex);border-color:var(--ex-b)"></i>면책</span>
      <span><i class="sw" style="background:var(--end-b);border-color:var(--end-b)"></i>소멸(계약상태처리 열)</span>
      <span>🔴 금액 오산출 위험 · 🟡 매핑·중복 점검 · ⚠ 문언상 확정 불가</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-view="rules">룰 테이블</button>
      <button class="tab" data-view="manual">심사자 수기</button>
      <button class="tab" data-view="missing">근거 없음</button>
      <button class="tab" data-view="compare">정답지 비교</button>
    </div>
    <div class="views">
      <div class="view on" id="view-rules"><div class="empty">왼쪽에서 약관을 입력하고 [변환]을 누르세요.</div></div>
      <div class="view" id="view-manual"></div>
      <div class="view" id="view-missing"></div>
      <div class="view" id="view-compare"><div class="empty">[정답지와 비교]로 정답지 엑셀을 올리면 결과가 여기에 표시됩니다.</div></div>
      <div class="detail" id="detail" hidden></div>
    </div>
  </section>
</main>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/cmaps-ko.js"></script>
<script src="vendor/pdf.worker.min.js"></script>
<script src="vendor/pdf.min.js"></script>
<script src="src/schema.js"></script>
<script src="src/engine.js"></script>
<script src="src/ai.js"></script>
<script src="src/pdf-text.js"></script>
<script src="samples/dummy-terms.js"></script>
<script src="samples/dummy-riders.js"></script>
<script src="src/app.js"></script>
</body>
</html>
